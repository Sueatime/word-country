*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Outfit",system-ui,sans-serif;font-size:18px;display:flex;justify-content:center}
main{width:100%;max-width:480px;padding:24px 16px 40px;text-align:center}

.sub{margin:0 0 12px;color:var(--muted);font-size:18px}
button{font:inherit;font-weight:600;cursor:pointer}
#msg{min-height:26px;font-weight:600;margin:6px 0 10px}
.places{display:flex;flex-direction:column;gap:8px;margin:0 0 14px}
.pl{padding:12px;border-radius:12px;border:2px solid var(--muted);background:var(--panel);font-size:1.2em;font-weight:600}
.flag{border:2px solid var(--muted);border-radius:12px;overflow:hidden;margin:0 auto;width:100%;max-width:300px;aspect-ratio:3/2;background:var(--panel)}
.flag svg{display:block;width:100%;height:100%}
#hn{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 18px;min-height:44px;margin:0 0 28px}
.wd{display:flex;gap:5px}
.ht{--s:min(var(--cap,44px),calc((100vw - 48px - (var(--n) - 1) * 5px) / var(--n)));width:var(--s);height:var(--s);border:2px solid var(--muted);display:flex;align-items:center;justify-content:center;font-size:calc(var(--s) * .5);font-weight:700;text-transform:uppercase;color:var(--ink);background:var(--panel);border-radius:8px}
.ht.g{background:var(--g);border-color:var(--g);color:#052e16}
.row{display:flex;gap:8px;justify-content:center;margin:0 0 10px}
input{font:inherit;font-size:22px;letter-spacing:3px;text-transform:uppercase;width:100%;max-width:340px;padding:10px;border-radius:8px;border:2px solid var(--pur);background:transparent;color:var(--ink);text-align:center}
input:disabled{opacity:.4}
input:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.acts{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.acts button{padding:10px 18px;border-radius:8px;background:transparent;color:var(--ink);border:2px solid var(--muted)}
.acts button:disabled{opacity:.4;cursor:not-allowed}
button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.win{background:var(--pur);color:#fff;border-radius:10px;padding:12px;font-size:22px;font-weight:800;max-width:420px;margin:0 auto;animation:pop .5s ease-out;word-break:break-word}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){.win{animation:none}}
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:30}
@media (min-width:800px){
:root{--cap:70px}
body{font-size:26px}
main{max-width:820px;padding-top:32px}
h1{font-size:66px;margin-bottom:12px}
.sub{font-size:25px}
.win{font-size:30px;max-width:620px}
#msg{min-height:40px}
.acts button{padding:14px 30px}

const $=id=>document.getElementById(id);
let cur,done;
function msg(t,c){$("msg").textContent=t;$("msg").style.color=c||"var(--ink)"}
let last,hl=0,wt=0;
function next(){
 let q;
 do{
  if(Math.random()<.5){const f=F[Math.floor(Math.random()*F.length)];q={n:f[0],a:[f[0],...(AF[f[0]]||[])],f}}
  else{const d=D[Math.floor(Math.random()*D.length)];q={n:d.n,a:d.a,p:[d.p[0],...sh(d.p.slice(1)).slice(0,2)]}}
 }while(q.n===last);
 last=q.n;cur=q;done=false;
 $("places").innerHTML=q.f?`<div class="flag">${svg(q.f)}</div>`:sh(q.p).map(x=>`<div class="pl">${x}</div>`).join("");
 $("g").value="";["g","hint","skip"].forEach(i=>$(i).disabled=false);
 msg("");hl=0;$("hn").textContent="";$("g").focus()}
function finish(){done=true;["g","hint","skip"].forEach(i=>$(i).disabled=true);wt=Date.now()}
function pname(){try{return(new URLSearchParams(location.search).get("name")||window.playerName||"").trim().slice(0,30)}catch(e){return""}}
function popup(nm){const d=document.createElement("div");d.className="win";d.textContent=(nm||pname()||"Player")+" won with \u2018"+cur.n.toUpperCase()+"\u2019";const m=$("msg");m.style.color="";m.textContent="";m.appendChild(d);const q=cur;setTimeout(()=>{if(done&&cur===q)next()},6000)}
function showAll(){const w=cur.n.split(" ");$("hn").style.setProperty("--n",Math.max(...w.map(x=>x.length)));$("hn").innerHTML=w.map(word=>`<span class="wd">${[...word].map(ch=>`<span class="ht g">${ch}</span>`).join("")}</span>`).join("")}
function win(nm){finish();showAll();popup(nm);confetti()}
function ok(t){const v=norm(String(t||""));return v&&cur.a.some(x=>norm(x)===v)}
function guess(){
 if(done)return;if(!norm($("g").value))return;
 if(ok($("g").value))win("");
 else{msg("Not quite, try again.","var(--r)");$("g").select()}}
function remote(w,name){if(done)return;if(ok(w))win(String(name||"").trim().slice(0,30))}
window.submitGuess=remote;
window.addEventListener("message",e=>{const d=e.data;if(d&&d.type==="guess")remote(d.word,d.name)});
const LIVE=/[?&]live=1/.test(location.search)||location.protocol==="file:";
function tikfinity(){let ws;try{ws=new WebSocket("ws://127.0.0.1:21213/")}catch(e){return}
 ws.onmessage=ev=>{try{const m=JSON.parse(ev.data),d=m.data||m;if(!/chat|comment/i.test(String(m.event||m.type||"")))return;const u=d.user||{};remote(d.comment||d.text||d.message,d.nickname||d.uniqueId||u.nickname||u.uniqueId)}catch(e){}};
 ws.onclose=()=>setTimeout(tikfinity,3000);ws.onerror=()=>ws.close()}
if(LIVE)tikfinity();
$("nb").onclick=()=>{if(done&&Date.now()-wt<800)return;next()};
$("g").onkeydown=e=>{if(e.key==="Enter")guess()};
$("hint").onclick=()=>{if(done||hl>=3)return;hl++;
 const w=cur.n.split(" ");$("hn").style.setProperty("--n",Math.max(...w.map(x=>x.length)));
 $("hn").innerHTML=w.map((word,wi)=>`<span class="wd">${[...word].map((ch,i)=>`<span class="ht">${(hl>1&&wi==0&&i==0)||(hl>2&&wi==w.length-1&&i==word.length-1)?ch:""}</span>`).join("")}</span>`).join("");
 if(hl>=3)$("hint").disabled=true;$("g").focus()};
$("skip").onclick=()=>{if(done)return;msg("You gave up. The answer was "+cur.n.toUpperCase()+".");finish()};
function confetti(){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  const c=document.createElement("canvas");c.id="confetti";c.width=innerWidth;c.height=innerHeight;document.body.append(c);
  const x=c.getContext("2d"),cols=[0,45,150,200,260,320].map(h=>`hsl(${h} 85% 55%)`);
  const ps=Array.from({length:150},()=>({x:innerWidth/2+(Math.random()-.5)*160,y:innerHeight*.35,vx:(Math.random()-.5)*15,vy:-Math.random()*13-4,s:6+Math.random()*6,r:Math.random()*6,vr:(Math.random()-.5)*.4,c:cols[Math.floor(Math.random()*cols.length)]}));
  let t=0;
  (function f(){
    x.clearRect(0,0,c.width,c.height);t++;
    ps.forEach(p=>{p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.vx*=.99;p.r+=p.vr;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);x.restore()});
    if(t<160)requestAnimationFrame(f);else c.remove();
  })();
}
next();
</script></body></html>
